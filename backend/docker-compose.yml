# Postgres 16 cho backend DropIt! (cổng host 55433 để không đụng container dropit-pg ở 55432)
name: dropit-backend
services:
  db:
    image: postgres:16
    container_name: dropit-backend-pg
    environment:
      POSTGRES_USER: dropit
      POSTGRES_PASSWORD: dropit
      POSTGRES_DB: dropit
    ports:
      - "55433:5432"
    volumes:
      - ../design/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/seed-demo.sql:/docker-entrypoint-initdb.d/03-seed-demo.sql:ro
      - ./db/seed-cosmetics.sql:/docker-entrypoint-initdb.d/04-seed-cosmetics.sql:ro
      - dropit-backend-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropit -d dropit"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dropit-backend-pgdata:
