name: Register Nail Play bundle ID

# One-off helper: registers com.tuttylab.nailplay on the shared Apple team
# with this repo's App Store Connect API key. Safe to re-run; skips if present.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register bundle ID
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet 'pyjwt[crypto]==2.10.1'
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, jwt
          BUNDLE, NAME = 'com.tuttylab.nailplay', 'Nail Play'
          now = int(time.time())
          token = jwt.encode({'iss': os.environ['ASC_ISSUER_ID'], 'iat': now, 'exp': now + 600, 'aud': 'appstoreconnect-v1'},
                             os.environ['ASC_API_KEY_P8'], algorithm='ES256', headers={'kid': os.environ['ASC_KEY_ID']})
          def api(method, path, body=None):
              req = urllib.request.Request('https://api.appstoreconnect.apple.com/v1' + path, method=method,
                                           data=json.dumps(body).encode() if body else None,
                                           headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                  detail = json.loads(e.read() or b'{}').get('errors', [{}])[0].get('detail', '')
                  raise SystemExit(f'App Store Connect {method} failed ({e.code}): {detail}')
          found = [b for b in api('GET', f'/bundleIds?filter[identifier]={BUNDLE}')['data'] if b['attributes']['identifier'] == BUNDLE]
          if found:
              print(f'{BUNDLE} already registered (id {found[0]["id"]})')
          else:
              created = api('POST', '/bundleIds', {'data': {'type': 'bundleIds', 'attributes': {'identifier': BUNDLE, 'name': NAME, 'platform': 'IOS'}}})
              print(f'Registered {BUNDLE} (id {created["data"]["id"]})')
          PY
