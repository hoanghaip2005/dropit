name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload signed IPA to TestFlight (no App Store submission)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dropit-testflight
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
      - run: flutter test
        working-directory: app/packages/focus_lifecycle

  ios:
    needs: quality
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Check toolchain
        run: |
          xcodebuild -version
          flutter --version
          flutter pub get --enforce-lockfile
      - name: Install isolated signing identity
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: python3 scripts/ios_ci_signing.py install
      - name: Configure manual distribution signing
        run: |
          gem install xcodeproj --version 1.27.0 --no-document --user-install
          export GEM_HOME="$(ruby -e 'puts Gem.user_dir')"
          ruby scripts/ios_ci_project.rb
      - name: Archive and export IPA
        run: |
          build_number=$((100 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          flutter build ipa --release \
            --build-number="$build_number" \
            --dart-define-from-file=config/firebase-ios.json \
            --export-options-plist="$RUNNER_TEMP/dropit-signing/ExportOptions.plist"
      - name: Keep signed IPA briefly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dropit-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Upload to TestFlight
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/dropit-signing/private_keys
        run: |
          shopt -s nullglob
          files=(build/ios/ipa/*.ipa)
          [[ ${#files[@]} == 1 ]] || { echo 'Expected exactly one IPA'; exit 1; }
          xcrun altool --upload-app --type ios --file "${files[0]}" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove signing secrets
        if: always()
        run: python3 scripts/ios_ci_signing.py cleanup
