components:
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token Amazon Cognito User Pool. Quyền admin = nhóm Cognito `admin` (claim cognito:groups, US-09.01) — mọi /admin/* trả 403 nếu thiếu. Vai trò chủ nhóm/thành viên tính theo từng nhóm ở server (D-10), không nằm trong token.
  parameters:
    GroupId: { name: group_id, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: session_id, in: path, required: true, schema: { type: string, format: uuid } }
    Month: { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
    MonthQuery: { name: month, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
    Cursor: { name: cursor, in: query, required: false, description: 'Con trỏ mờ lấy từ next_cursor', schema: { type: string } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    From: { name: from, in: query, required: false, schema: { type: string, format: date-time } }
    To: { name: to, in: query, required: false, schema: { type: string, format: date-time } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 do client sinh. Server giữ 24 giờ theo (user, key); cùng khóa + cùng thân → trả lại phản hồi cũ; khác thân → 422 IDEMPOTENCY_MISMATCH.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag từ lần GET trước; lệch → 409 VERSION_CONFLICT.
      schema: { type: string }
  responses:
    BadRequest:
      description: VALIDATION_FAILED
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: 'UNAUTHENTICATED | TOKEN_EXPIRED'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: 'FORBIDDEN_GROUP | NOT_GROUP_OWNER | ACCOUNT_LOCKED | CONSENT_REQUIRED | OWNER_CANNOT_JOIN_SESSION | ADMIN_REQUIRED'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: 'NOT_FOUND | INVITE_CODE_INVALID'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: 'VERSION_CONFLICT | SESSION_IN_PROGRESS'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unprocessable:
      description: 'Vi phạm quy tắc nghiệp vụ | IDEMPOTENCY_MISMATCH'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooMany:
      description: 'RATE_LIMITED | INVITE_CODE_LOCKED (BR-76: 5 lần sai trong 15 phút → khóa 15 phút)'
      headers:
        Retry-After:
          description: Số giây chờ
          schema: { type: integer }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - ACCOUNT_LOCKED
        - ADMIN_REQUIRED
        - FORBIDDEN_GROUP
        - NOT_GROUP_OWNER
        - CONSENT_REQUIRED
        - OWNER_CANNOT_JOIN_SESSION
        - NOT_FOUND
        - INVITE_CODE_INVALID
        - INVITE_CODE_LOCKED
        - GROUP_FULL
        - ALREADY_IN_GROUP
        - OWNER_OF_THIS_GROUP
        - CONSENT_VERSION_STALE
        - MAX_GROUPS_OWNED
        - SCHEDULE_OVERLAP
        - START_IN_PAST
        - DURATION_OUT_OF_RANGE
        - SESSION_ALREADY_STARTED
        - SESSION_IN_PROGRESS
        - SESSION_NOT_FINISHED
        - NOT_EXITED_IN_SESSION
        - EXPLANATION_WINDOW_CLOSED
        - APPEAL_EXISTS
        - APPEAL_WINDOW_CLOSED
        - APPEAL_ALREADY_DECIDED
        - INSUFFICIENT_COINS
        - ITEM_UNAVAILABLE
        - ALREADY_OWNED
        - PRICE_CHANGED
        - ITEM_NOT_OWNED
        - BALANCE_WOULD_BE_NEGATIVE
        - JOURNAL_TOO_LONG
        - JOURNAL_DATE_INVALID
        - REPORT_NOT_READY
        - ALREADY_REPORTED
        - VERSION_CONFLICT
        - IDEMPOTENCY_MISMATCH
        - RATE_LIMITED
    Error:
      type: object
      description: RFC 9457 problem+json, thêm `code` nghiệp vụ ổn định.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ErrorCode' }
        detail: { type: string, description: 'Câu tiếng Việt hiển thị được, vd. "Bạn đang ở nhóm A. Rời nhóm A trước khi tham gia nhóm khác."' }
        br: { type: string, description: 'BR gây lỗi, vd. BR-75' }
        request_id: { type: string }
    PublicUser:
      type: object
      additionalProperties: false
      required: [user_id, display_name]
      description: Dùng cho mọi góc nhìn về người khác. Không có Coins/chuỗi.
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar_url: { type: [string, 'null'], format: uri }
        frame_item_id: { type: [string, 'null'] }
        background_item_id: { type: [string, 'null'] }
        title_item_id: { type: [string, 'null'] }
        joined_at: { type: [string, 'null'], format: date-time }
    PublicProfile:
      type: object
      additionalProperties: false
      description: 'BR-99: chỉ huy hiệu/chuỗi do chính người đó bật hiển thị. Người gọi là chủ nhóm → `shown_streak` luôn null (BR-53b).'
      properties:
        user: { $ref: '#/components/schemas/PublicUser' }
        role: { type: string, enum: [OWNER, MEMBER], description: 'Vai trò của người được xem trong nhóm chung (V-32, thêm 2026-10-20)' }
        shown_badges: { type: array, items: { type: string } }
        shown_streak: { type: [integer, 'null'] }
    MeProfile:
      type: object
      description: Dữ liệu của chính người gọi — được có Coins/chuỗi.
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email }
        avatar_url: { type: [string, 'null'], format: uri }
        frame_item_id: { type: [string, 'null'] }
        background_item_id: { type: [string, 'null'] }
        title_item_id: { type: [string, 'null'] }
        coins_balance: { type: integer, minimum: 0 }
        current_streak: { type: integer, minimum: 0 }
        longest_streak: { type: integer, minimum: 0 }
        show_streak: { type: boolean, description: 'BR-99: tự bật hiện chuỗi trên hồ sơ công khai (thêm 2026-10-20)' }
        status: { type: string, enum: [ACTIVE, LOCKED] }
    MyGroup:
      type: object
      required: [group_id, name, role]
      properties:
        group_id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [OWNER, MEMBER] }
        status: { type: string, enum: [ACTIVE, SCHEDULE_SUSPENDED, DISSOLVING], description: 'AC-02.06.1 (thêm 2026-10-20)' }
        member_count: { $ref: '#/components/schemas/MemberCount' }
        below_minimum: { type: [boolean, 'null'], description: 'Chỉ khi role = OWNER: dưới 4 thành viên (BR-74)' }
        month_completion_rate: { type: [number, 'null'], description: 'AC-02.06.6/BR-117: tỉ lệ hoàn thành phiên tháng hiện tại của RIÊNG nhóm này, tạm tính đến hôm qua (chủ nhóm: cả nhóm; thành viên: của mình). Không có chỉ số cộng nhiều nhóm.' }
        consent_version: { type: integer }
        needs_reconsent: { type: boolean, description: US-01.06 (Should) }
        next_session:
          oneOf:
            - $ref: '#/components/schemas/SessionSummary'
            - type: 'null'
    GroupInput:
      type: object
      required: [name, report_purpose]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        report_purpose: { type: string, minLength: 1, maxLength: 500, description: 'Mục đích sử dụng báo cáo, hiện ở màn đồng ý (BR-61, US-08.08)' }
    GroupOwnerView:
      type: object
      additionalProperties: false
      properties:
        group_id: { type: string, format: uuid }
        name: { type: string }
        report_purpose: { type: string }
        status: { $ref: '#/components/schemas/GroupStatus' }
        member_count: { $ref: '#/components/schemas/MemberCount' }
        below_minimum: { type: boolean }
        consent_version: { type: integer }
        invite_code: { type: string }
        created_at: { type: string, format: date-time }
    GroupMemberView:
      type: object
      additionalProperties: false
      properties:
        group_id: { type: string, format: uuid }
        name: { type: string }
        report_purpose: { type: string }
        status: { $ref: '#/components/schemas/GroupStatus' }
        member_count: { $ref: '#/components/schemas/MemberCount' }
        owner: { $ref: '#/components/schemas/PublicUser' }
    InviteCode:
      type: object
      properties:
        code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{8}$' }
        created_at: { type: string, format: date-time }
    ConsentDocument:
      type: object
      required: [group_id, group_name, consent_version, items]
      description: 'Nội dung đồng ý minh bạch (V-05): ai thấy gì, ghi gì, không ghi gì, thời hạn lưu (04 §2–§3).'
      properties:
        group_id: { type: string, format: uuid }
        group_name: { type: string }
        owner_display_name: { type: string }
        report_purpose: { type: string }
        consent_version: { type: integer }
        member_count: { $ref: '#/components/schemas/MemberCount' }
        is_full: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              text: { type: string }
              required: { type: boolean }
    ScheduleInput:
      type: object
      required: [start_time, duration_min]
      properties:
        start_time: { type: string, format: date-time, description: 'Phiên đơn: = sessions.started_at (BR-04). Lịch lặp: phần giờ → schedules.start_time, phần ngày → schedules.start_date (giờ Asia/Ho_Chi_Minh)' }
        duration_min: { $ref: '#/components/schemas/DurationMin' }
        recurrence:
          description: Should (US-02.10b)
          oneOf:
            - type: 'null'
            - type: object
              required: [weekdays, end_date]
              properties:
                weekdays: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 1, maximum: 7 }, description: 'schedules.weekdays, ISO 1 = Thứ Hai' }
                end_date: { type: string, format: date, description: 'schedules.end_date, ≤ start_date + recurrence_max_weeks (BR-113)' }
    Schedule:
      type: object
      properties:
        schedule_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
