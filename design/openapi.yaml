openapi: 3.1.0
info:
  title: DropIt! REST API
  version: 1.0.0-draft
  summary: Hợp đồng REST cho app DropIt! (Giai đoạn 3 Thiết kế, bản nháp)
  description: |
    Nguồn: ba/srs/02-ep0*.md (US/AC), 03-quy-tac.md (BR), 04-nfr-rieng-tu.md (ma trận ai thấy gì),
    05-tham-chieu-ky-thuat.md §2–§3 (tham khảo). Nguyên tắc chung xem design/03-api-socket.md.
    - Mọi thời gian là giờ server, ISO-8601 UTC (BR-03, BR-33).
    - Chủ nhóm không bao giờ nhận trường Coins/chuỗi của thành viên (BR-53, BR-61). Các schema
      `*OwnerView` không có các trường đó; `additionalProperties: false` để kiểm thử hợp đồng bắt lỗi.
    - Truy cập chéo nhóm → 403 FORBIDDEN_GROUP (NFR-11).
    - `x-moscow`: Must (mặc định, không ghi) / Should. `x-br`: BR liên quan. `x-us`: story nguồn.
    - Tên trường và giá trị enum khớp `design/schema.sql` / `02-du-lieu.md` (nguồn thắng). Ánh xạ trình bày (vd. `month` ↔ `monthly_reports.period`, `item_id` ↔ `shop_items.id`) xem 03-api-socket.md §1.2.
  license:
    name: Nội bộ nhóm Bá Khí
    identifier: LicenseRef-internal
servers:
  - url: https://api.dropit.example/v1
    description: Môi trường giả định (DQ-A01)
security:
  - cognitoJwt: []
tags:
  - name: EP-01 Tài khoản & đồng ý
    description: US-01.xx
  - name: EP-02 Nhóm & lịch
    description: US-02.xx
  - name: EP-03 Phiên tập trung
    description: US-03.xx (phần realtime ở Socket.io, xem 03-api-socket.md)
  - name: EP-04 Thông báo & giải trình
    description: US-04.xx
  - name: EP-05 Thành tích
    description: US-05.xx
  - name: EP-06 Coins & Shop
    description: US-06.xx
  - name: EP-07 Hồ sơ & nhật ký
    description: US-07.xx
  - name: EP-08 Báo cáo
    description: US-08.xx
  - name: EP-09 Quản trị
    description: US-09.xx (toàn bộ Should)
  - name: Hệ thống
    description: Tiện ích

paths:
  /time:
    get:
      tags: [Hệ thống]
      operationId: getServerTime
      summary: Giờ server để client hiệu chỉnh đồng hồ
      security: []
      x-br: [BR-03, BR-33]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [server_ts]
                properties:
                  server_ts: { type: string, format: date-time }
        '429': { $ref: '#/components/responses/TooMany' }

  # ---------------- EP-01 ----------------
  /me:
    get:
      tags: [EP-01 Tài khoản & đồng ý]
      operationId: getMe
      summary: Hồ sơ của tôi (tạo bản ghi users ở lần gọi đầu sau đăng nhập Cognito)
      x-us: [US-01.01, US-07.01, US-07.04]
      x-br: [BR-51, BR-52, BR-99]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MeProfile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [EP-01 Tài khoản & đồng ý]
      operationId: updateMe
      summary: Sửa tên hiển thị / bật hiện chuỗi trên hồ sơ (BR-99)
      x-us: [US-01.03, US-07.04]
      x-br: [BR-98]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name: { type: string, minLength: 1, maxLength: 40 }
                show_streak: { type: boolean, description: 'BR-99 (thêm 2026-10-20)' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MeProfile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [EP-01 Tài khoản & đồng ý]
      operationId: deleteMe
      summary: Xóa tài khoản (Should)
      x-moscow: Should
      x-us: [US-01.10]
      x-br: [BR-26, BR-62, BR-70, BR-72, BR-80]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202': { description: Đã nhận yêu cầu xóa; nhóm mình làm chủ bị giải tán (D-10) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/avatar:
    put:
      tags: [EP-07 Hồ sơ & nhật ký]
      operationId: requestAvatarUpload
      summary: Xin URL S3 ký sẵn để tải avatar (Should)
      x-moscow: Should
      x-us: [US-07.03]
      x-br: [BR-98]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size_bytes]
              properties:
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size_bytes: { type: integer, maximum: 5242880 }
      responses:
        '200':
          description: URL tải lên
          content:
            application/json:
              schema:
                type: object
                required: [upload_url, expires_at]
                properties:
                  upload_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/logout-check:
    get:
      tags: [EP-01 Tài khoản & đồng ý]
      operationId: logoutCheck
      summary: Kiểm tra được đăng xuất không (chặn khi có trạng thái phiên chưa kết thúc)
      x-us: [US-01.02]
      x-br: [BR-70]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [allowed]
                properties:
                  allowed: { type: boolean }
                  blocking_session_id: { type: [string, 'null'], format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/groups:
    get:
      tags: [EP-01 Tài khoản & đồng ý]
      operationId: listMyGroups
      summary: Nhóm của tôi kèm vai trò theo từng nhóm
      x-us: [US-01.04, US-02.06]
      x-br: [BR-75, BR-114, BR-115]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MyGroup' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/data:
    get:
      tags: [EP-01 Tài khoản & đồng ý]
      operationId: getMyData
      summary: Dữ liệu của tôi (loại dữ liệu đang lưu, thời hạn, ai thấy + dữ liệu cụ thể, lọc theo nhóm)
      x-us: [US-01.08]
      x-br: [BR-53]
      parameters:
        - { name: group_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: user_id, in: query, required: false, description: 'Chỉ để kiểm AC-01.08.3 — khác người gọi → 403', schema: { type: string } }
      responses:
        '403': { $ref: '#/components/responses/Forbidden' }
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyDataSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/data/export:
    post:
      tags: [EP-01 Tài khoản & đồng ý]
      operationId: exportMyData
      summary: Xuất dữ liệu của tôi (Should)
      x-moscow: Should
      x-us: [US-01.09]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202': { description: Đang tạo tệp; nhận thông báo khi xong }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooMany' }
  /me/access-log:
    get:
      tags: [EP-01 Tài khoản & đồng ý]
      operationId: getMyAccessLog
      summary: Ai đã xem dữ liệu của tôi (Should)
      x-moscow: Should
      x-us: [US-01.11]
      x-br: [BR-73]
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_cursor: { type: [string, 'null'] }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccessLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/devices:
    put:
      tags: [EP-04 Thông báo & giải trình]
      operationId: registerDevice
      summary: Đăng ký token push (tạo/cập nhật SNS platform endpoint)
      x-us: [US-04.01]
      x-br: [BR-27, BR-82]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, push_token]
              properties:
                platform: { type: string, enum: [IOS, ANDROID] }
                push_token: { type: string }
      responses:
        '204': { description: Đã đăng ký }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /invites/{code}:
    get:
      tags: [EP-01 Tài khoản & đồng ý]
      operationId: previewInvite
      summary: Nhập mã nhóm → xem nội dung đồng ý (chưa là thành viên)
      x-us: [US-02.03, US-01.05]
      x-br: [BR-06, BR-75, BR-76]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: '^[A-HJ-NP-Z2-9]{8}$' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConsentDocument' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }
  /groups/{group_id}/consent:
    post:
      tags: [EP-01 Tài khoản & đồng ý]
      operationId: acceptConsent
      summary: Đồng ý minh bạch → thành viên (kiểm tra trần 10 và giới hạn 1 nhóm tại lúc này)
      x-us: [US-01.05, US-01.06]
      x-br: [BR-06, BR-74, BR-75, BR-76, BR-114]
      parameters: [ { $ref: '#/components/parameters/GroupId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_version]
              properties:
                consent_version: { type: integer }
                invite_code: { type: string, description: Bắt buộc khi vào lần đầu; bỏ trống khi đồng ý lại (US-01.06) }
                accepted_items: { type: array, items: { type: string }, description: Mã từng mục đã tích (AC-01.05.x) }
      responses:
        '201': { description: Đã là thành viên, content: { application/json: { schema: { $ref: '#/components/schemas/MyGroup' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'GROUP_FULL | ALREADY_IN_GROUP | OWNER_OF_THIS_GROUP | CONSENT_VERSION_STALE'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [EP-01 Tài khoản & đồng ý]
      operationId: withdrawConsent
      summary: Rút đồng ý và rời nhóm (nếu đang trong phiên → WITHDRAWN, BR-26)
      x-us: [US-01.07]
      x-br: [BR-26, BR-32, BR-37, BR-48, BR-59, BR-74]
      parameters: [ { $ref: '#/components/parameters/GroupId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200':
          description: 'Đã rời nhóm. `sessions` = phiên đang chạy bị chuyển WITHDRAWN (after_forfeit → vẫn ngắt chuỗi, D-23). Đổi từ 204 (2026-10-20).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_id: { type: string, format: uuid }
                  left_at: { type: string, format: date-time }
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id: { type: string, format: uuid }
                        state: { type: string, enum: [WITHDRAWN] }
                        after_forfeit: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- EP-02 ----------------
  /groups:
    post:
      tags: [EP-02 Nhóm & lịch]
      operationId: createGroup
      summary: Tạo nhóm (người tạo là chủ nhóm, không là thành viên)
      x-us: [US-02.01]
      x-br: [BR-74, BR-75, BR-114]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { $ref: '#/components/schemas/GroupOwnerView' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: MAX_GROUPS_OWNED, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /groups/{group_id}:
    get:
      tags: [EP-02 Nhóm & lịch]
      operationId: getGroup
      summary: Thông tin nhóm (theo vai trò người gọi)
      x-us: [US-02.06]
      x-br: [BR-74, BR-114]
      parameters: [ { $ref: '#/components/parameters/GroupId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GroupOwnerView'
                  - $ref: '#/components/schemas/GroupMemberView'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [EP-02 Nhóm & lịch]
      operationId: updateGroup
      summary: Sửa thông tin nhóm; đổi nội dung đồng ý → tăng consent_version (Should)
      x-moscow: Should
      x-us: [US-02.02, US-01.06]
      x-br: [BR-06, BR-71]
      parameters: [ { $ref: '#/components/parameters/GroupId' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/GroupOwnerView' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [EP-02 Nhóm & lịch]
      operationId: dissolveGroup
      summary: Giải tán nhóm (Should)
      x-moscow: Should
      x-us: [US-02.09]
      x-br: [BR-29, BR-62, BR-80]
      parameters: [ { $ref: '#/components/parameters/GroupId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '204': { description: Đã giải tán }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: SESSION_IN_PROGRESS, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /groups/{group_id}/invite-code:
    get:
      tags: [EP-02 Nhóm & lịch]
      operationId: getInviteCode
      summary: Xem mã mời (chủ nhóm)
      x-us: [US-02.03]
      x-br: [BR-76]
      parameters: [ { $ref: '#/components/parameters/GroupId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/InviteCode' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [EP-02 Nhóm & lịch]
      operationId: rotateInviteCode
      summary: Đổi mã mời (mã cũ hết hiệu lực ngay)
      x-us: [US-02.03]
      x-br: [BR-76]
      parameters: [ { $ref: '#/components/parameters/GroupId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '201': { description: Mã mới, content: { application/json: { schema: { $ref: '#/components/schemas/InviteCode' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /groups/{group_id}/email-invites:
    post:
      tags: [EP-02 Nhóm & lịch]
      operationId: sendEmailInvites
      summary: Mời bằng email qua SES (Should)
      x-moscow: Should
      x-us: [US-02.04]
      x-br: [BR-74, BR-75, BR-76, BR-122]
      parameters: [ { $ref: '#/components/parameters/GroupId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emails]
              properties:
                emails: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: email } }
      responses:
        '202': { description: Đã xếp hàng gửi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooMany' }
  /groups/{group_id}/members:
    get:
      tags: [EP-02 Nhóm & lịch]
      operationId: listGroupMembers
      summary: Thành viên nhóm — chủ nhóm đầu, còn lại theo tên (BR-115). Không Coins/chuỗi.
      x-us: [US-02.06]
      x-br: [BR-53, BR-74, BR-99, BR-115]
      parameters: [ { $ref: '#/components/parameters/GroupId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [owner, members, member_count]
                properties:
                  owner: { $ref: '#/components/schemas/PublicUser' }
                  members: { type: array, items: { $ref: '#/components/schemas/PublicUser' } }
                  member_count: { $ref: '#/components/schemas/MemberCount' }
                  below_minimum: { type: [boolean, 'null'], description: 'Chỉ có giá trị khi người gọi là chủ nhóm (BR-74, cảnh báo dưới 4)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /groups/{group_id}/members/{user_id}:
    delete:
      tags: [EP-02 Nhóm & lịch]
      operationId: removeMember
      summary: Chủ nhóm xóa thành viên (giữa phiên → BR-77)
      x-us: [US-02.08]
      x-br: [BR-32, BR-59, BR-74, BR-77]
      parameters: [ { $ref: '#/components/parameters/GroupId' }, { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '202':
          description: 'Người này đang có trạng thái chưa kết thúc trong phiên đang chạy → hiệu lực sau ends_at (BR-77, thêm 2026-10-20)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
                  effective: { type: string, enum: [AFTER_SESSION] }
                  effective_at: { type: string, format: date-time }
                  session_id: { type: string, format: uuid }
        '204': { description: Đã xóa (hiệu lực ngay) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'CANNOT_REMOVE_SELF — gợi ý "Giải tán nhóm" (AC-02.08.3)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /groups/{group_id}/schedules:
    get:
      tags: [EP-02 Nhóm & lịch]
      operationId: listSchedules
      summary: Lịch phiên của nhóm trong khoảng thời gian
      x-us: [US-02.10, US-02.11]
      parameters: [ { $ref: '#/components/parameters/GroupId' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' } ]
      responses:
        '200':
          description: OK — theo started_at tăng dần
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SessionSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [EP-02 Nhóm & lịch]
      operationId: createSchedule
      summary: Đặt lịch một lần (Must) hoặc lặp lại (Should, có `recurrence`)
      x-us: [US-02.10, US-02.10b]
