name: dropit
description: "DropIt! — app tập trung theo nhóm (Bá Khí)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.7.0
  socket_io_client: ^3.1.6
  shared_preferences: ^2.3.0
  uuid: ^4.5.0
  focus_lifecycle:
    path: packages/focus_lifecycle
  google_fonts: ^8.2.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
