name: dropit
description: "DropIt! — app tập trung theo nhóm (Bá Khí)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.7.0
  socket_io_client: ^3.1.6
  shared_preferences: ^2.3.0
  uuid: ^4.5.0
  focus_lifecycle:
    path: packages/focus_lifecycle
  google_fonts: ^8.2.1
  image_picker: ^1.2.4
  flutter_svg: ^2.3.0
  firebase_core: 4.0.0
  firebase_messaging: 16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/mockup/
    - assets/cosmetics/
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: "assets/icon/foreground.png"

flutter_native_splash:
  color: "#141414"
  image: assets/icon/splash.png
  android_12:
    color: "#141414"
    image: assets/icon/splash-android12.png
    icon_background_color: "#141414"
  web: false
