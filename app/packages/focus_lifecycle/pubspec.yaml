name: focus_lifecycle
description: "DropIt! — phát hiện rời app / khóa màn hình trong phiên (tách từ spike T-01). Nội bộ."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.bakhi.dropit.focus_lifecycle
        pluginClass: FocusLifecyclePlugin
      ios:
        pluginClass: FocusLifecyclePlugin
