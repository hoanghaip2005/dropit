# Spike T-01 / T-06 — build Android APK debug + iOS IPA -> TestFlight (D-26: không có Mac).
# LƯU Ý: GitHub chỉ đọc workflow ở .github/ của GỐC repo. Nếu repo gốc là D:\DropIt!,
# chép file này sang <gốc>/.github/workflows/ và đặt APP_DIR = spike/t01-lifecycle.
name: t01-lifecycle-build

on:
  workflow_dispatch:
    inputs:
      ios:
        description: "Build iOS + đẩy TestFlight (tốn phút macOS)"
        type: boolean
        default: true

env:
  APP_DIR: .            # đổi thành spike/t01-lifecycle nếu repo gốc là D:\DropIt!
  FLUTTER_VERSION: "3.44.2"
  BUNDLE_ID: com.bakhi.dropit.t01Lifecycle

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: t01-lifecycle-debug-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    if: ${{ inputs.ios }}
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cài chứng chỉ + provisioning profile vào keychain tạm
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/build.keychain-db
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/dist.p12
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/app.mobileprovision
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security import $RUNNER_TEMP/dist.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KC
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KC
          security list-keychain -d user -s $KC
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/app.mobileprovision)")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/app.mobileprovision)")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Đặt ký thủ công cho target Runner
        run: |
          P=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.bakhi.dropit.t01Lifecycle;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = $TEAM_ID;\n\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/" $P
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST

      - run: flutter pub get
      - name: Build IPA
        run: flutter build ipa --release --build-number=${{ github.run_number }} --export-options-plist=$RUNNER_TEMP/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: t01-lifecycle-ipa
          path: ${{ env.APP_DIR }}/build/ios/ipa/*.ipa

      - name: Tải lên TestFlight (altool + App Store Connect API key)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -t ios -f build/ios/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Dọn keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain-db || true
